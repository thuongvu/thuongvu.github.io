<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <div class="header-end">
    <nav class="nav" aria-label="Primary">
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/writing/' | relative_url }}"{% if page.url contains '/writing' %} aria-current="page"{% endif %}>Writing</a>
    </nav>
    <button
      type="button"
      class="theme-toggle"
      data-theme-toggle
      aria-label="Switch to dark mode"
    >
      <span class="theme-toggle-icon" aria-hidden="true">◐</span>
    </button>
  </div>
</header>
