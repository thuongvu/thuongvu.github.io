<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {
          /* localStorage unavailable */
        }
      })();
    </script>
    <title>
      {%- if page.url == '/' -%}
        {{ site.title }}
      {%- elsif page.title -%}
        {{ page.title }} · {{ site.title }}
      {%- else -%}
        {{ site.title }}
      {%- endif -%}
    </title>
    {% seo title=false %}
    <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/png" />
    <link rel="apple-touch-icon" href="{{ '/assets/favicon.png' | relative_url }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Source+Serif+4:opsz,wght@8..60,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
    {% feed_meta %}
  </head>
  <body>
    <div class="page">
      {% include header.html %}
      <main class="main" id="main">
        {{ content }}
      </main>
      {% include footer.html %}
    </div>
    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  </body>
</html>
